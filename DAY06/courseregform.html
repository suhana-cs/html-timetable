<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Registration Form</title>


   <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px 60px;
        background: #111225;
        color: white;
        font-family: Arial, sans-serif;
    }

    h1 {
        text-align: center;
        color: #8ee000;
        font-size: 42px;
        margin-bottom: 30px;
    }

    form {
        width: 90%;
        margin: auto;
    }

    fieldset {
        border: 3px solid #238cff;
        border-radius: 20px;
        padding: 25px 35px 35px;
        background: #15182f;
    }

    legend {
        background: #218cff;
        color: white;
        padding: 10px 30px;
        border-radius: 15px;
        font-size: 24px;
        font-weight: bold;
    }

    table {
        width: 100%;
        border-spacing: 0 18px;
    }

    td:first-child {
        width: 30%;
    }

    td {
        padding: 5px;
    }

    label {
        color: #ffd900;
        font-size: 21px;
        font-weight: bold;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    input[type="number"],
    select {
        width: 100%;
        max-width: 500px;
        height: 50px;

        background: #173b4d;
        color: white;

        border: 3px solid #238cff;
        border-radius: 12px;

        padding: 8px 15px;
        font-size: 18px;
    }

    input::placeholder {
        color: #dddddd;
    }

    input[type="radio"] {
        width: 20px;
        height: 20px;
        accent-color: #ff3333;
        vertical-align: middle;
    }

    input[type="radio"] + label {
        margin-right: 15px;
        font-size: 18px;
    }

    input[type="file"] {
        color: white;
        font-size: 17px;
    }

    button {
        background: #238cff;
        color: white;

        border: none;
        border-radius: 10px;

        padding: 12px 25px;
        font-size: 18px;
        font-weight: bold;

        cursor: pointer;
    }

    button:hover {
        background: #126dcc;
    }

    select option {
        background: #173b4d;
        color: white;
    }
</style>
</head>

<body>

    <h1>Course Registration Form</h1>

    <form action="#" autocomplete="on">

        <fieldset>

            <legend>Personal Details</legend>

            <table>

                <tr>
                    <td>
                        <label for="fname">First Name</label>
                    </td>

                    <td>
                        <input
                            type="text"
                            name="fname"
                            id="fname"
                            required
                            placeholder="Ex: Arun">
                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="sname">Surname</label>
                    </td>

                    <td>
                        <input
                            type="text"
                            name="sname"
                            id="sname"
                            required
                            placeholder="Ex: Sharma">
                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="mobile">Mobile Number</label>
                    </td>

                    <td>
                        <input
                            type="tel"
                            name="mobile"
                            id="mobile"
                            required
                            placeholder="Ex: 7882272728">
                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="email">Email</label>
                    </td>

                    <td>
                        <input
                            type="email"
                            name="email"
                            id="email"
                            required
                            placeholder="example@gmail.com">
                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="password">Password</label>
                    </td>

                    <td>
                        <input
                            type="password"
                            name="password"
                            id="password"
                            required>
                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="cpassword">Confirm Password</label>
                    </td>

                    <td>
                        <input
                            type="password"
                            name="cpassword"
                            id="cpassword"
                            required>
                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="dob">Date of Birth</label>
                    </td>

                    <td>
                        <input
                            type="date"
                            name="dob"
                            id="dob"
                            required>
                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="age">Age</label>
                    </td>

                    <td>
                        <input
                            type="number"
                            name="age"
                            id="age"
                            min="18"
                            max="65"
                            required>
                    </td>
                </tr>


                <tr>
                    <td>
                        <label>Gender</label>
                    </td>

                    <td>

                        <input
                            type="radio"
                            name="gender"
                            id="male"
                            value="Male"
                            required>

                        <label for="male">Male</label>


                        <input
                            type="radio"
                            name="gender"
                            id="female"
                            value="Female">

                        <label for="female">Female</label>


                        <input
                            type="radio"
                            name="gender"
                            id="others"
                            value="Others">

                        <label for="others">Others</label>

                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="country">Select Country</label>
                    </td>

                    <td>

                        <select
                            name="country"
                            id="country"
                            required>

                            <option value="">
                                -- Select Country --
                            </option>

                            <option value="INDIA">
                                INDIA
                            </option>

                            <option value="CANADA">
                                CANADA
                            </option>

                            <option value="USA">
                                USA
                            </option>

                            <option value="GERMANY">
                                GERMANY
                            </option>

                        </select>

                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="photo">Upload Picture</label>
                    </td>

                    <td>
                        <input
                            type="file"
                            name="photo"
                            id="photo"
                            required>
                    </td>
                </tr>


                <tr>
                    <td></td>

                    <td>
                        <button type="submit">
                            Submit Form
                        </button>
                    </td>
                </tr>

            </table>

        </fieldset>

    </form>

</body>

</html>
